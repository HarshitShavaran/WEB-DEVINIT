<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Modal</title>
    <style>
    * 
    {

        box-sizing: border-box; /*karna padega */
        margin: 0px;
        padding: 0px;
        
        
   
        
    }
    .container
    {   
       
        text-align: center;
        background-color: rgb(118, 230, 223);
        height:400px;
        width:400px;
        padding: 20px;
        border: 10px solid rgb(6, 22, 243);
    }
    .subcontainer
    {
    
        text-align: center;
        background-color: rgb(118, 230, 223);
       height:400px;
        width:400px;
        padding: 20px;
        border: 10px solid rgb(6, 22, 243);
    }
    </style>
</head>
<body>
    <div class="container">
        Hello Harshit
        <!-- in border box highest priority is given to border box then padding box and then content box.
        in content box highest priority is given to content box then padding box and then border box. -->
    </div >
    <br>

    <div class="subcontainer">
        Hello Harshit
    </div>
</body>
</html>
